name: 读取 Secrets 临时

on:
  workflow_dispatch:

jobs:
  read-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: 输出 GH_PAT_ACCOUNT_B
        run: |
          echo "GH_PAT_ACCOUNT_B: $GH_PAT_ACCOUNT_B"
          echo "GH_PAT_ACCOUNT_B 长度: ${#GH_PAT_ACCOUNT_B}"
      - name: 输出 GH_PAT_ACCOUNT_C
        run: |
          echo "GH_PAT_ACCOUNT_C: $GH_PAT_ACCOUNT_C"
          echo "GH_PAT_ACCOUNT_C 长度: ${#GH_PAT_ACCOUNT_C}"
