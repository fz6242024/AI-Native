name: AlphaSift 主节点筛选

permissions:
  contents: write

on:
  schedule:
    - cron: '0 1 * * 1-5'
    - cron: '30 4 * * 1-5'
  workflow_dispatch:
    inputs:
      stocks_filter:
        description: '可选：只筛选特定股票代码（逗号分隔），留空则全量筛选'
        required: false
        default: ''

jobs:
  alpha-sift-discovery:
    name: AlphaSift 初选
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      ALPHASIFT_USE_LOCAL_SNAPSHOT: "1"
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      # LLM 排序输出预算。诊断见 deliverables/gstack/debug-llm-ranking-failure-2026-09-23.md
      # 线上事故：30 候选 x 15 字段的输出需求 > 8192 tokens，2048 时必然被
      # finish_reason=length 截断 -> JSON 不完整 -> no_json_found（9/10 策略失败，
      # 白烧 850s）。实测 8 候选 + 4096 tokens 可稳定产出合法 JSON。
      # 超时：实测单次响应 33-46s，原 60s 过于贴近，放宽到 120s。
      LLM_MAX_CANDIDATES: "8"
      LLM_MAX_TOKENS: "4096"
      LLM_TIMEOUT_SEC: "120"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      FEISHU_WEBHOOK_MAIN: ${{ secrets.FEISHU_WEBHOOK_MAIN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖 + AlphaSift
        run: |
          pip install -r requirements.txt
          pip install git+https://github.com/ZhuLinsen/alphasift.git@main

      - name: 应用 alphasift JSON 容错补丁
        # 上游 ranker.py 无法容错 LLM 返回的畸形 JSON（截断 / 缺冒号 / 裸换行），
        # 会导致 LLM 排序大面积失败。而 alphasift_discovery.py 优先 import 已安装
        # 的包，改本地源码在 CI 里不生效，所以这里覆盖已安装文件。
        # 上游合入同等修复后可删除本步骤与 vendor/alphasift/。
        run: python scripts/apply_alphasift_patch.py

      - name: 运行 AlphaSift 初选
        id: discovery
        run: |
          FILTER="${{ github.event.inputs.stocks_filter }}"
          if [ -n "$FILTER" ]; then
            python scripts/alphasift_discovery.py --output top_10_stocks.json --filter "$FILTER"
          else
            python scripts/alphasift_discovery.py --output top_10_stocks.json
          fi

          echo "=== 初选结果 ==="
          cat top_10_stocks.json

          STOCKS=$(python -c "
          import json
          with open('top_10_stocks.json') as f:
              data = json.load(f)
          stocks = [s.get('code', s) if isinstance(s, dict) else s for s in data]
          print(','.join(stocks))
          ")
          echo "stock_list=${STOCKS}" >> $GITHUB_OUTPUT

          FIRST5=$(echo "$STOCKS" | cut -d',' -f1-5)
          LAST5=$(echo "$STOCKS" | cut -d',' -f6-10)
          echo "first5=${FIRST5}" >> $GITHUB_OUTPUT
          echo "last5=${LAST5}" >> $GITHUB_OUTPUT

      - name: 拆分 Top 10 并通知从节点
        id: trigger-slaves
        env:
          GH_PAT_ACCOUNT_B: ${{ secrets.GH_PAT_ACCOUNT_B }}
          GH_PAT_ACCOUNT_C: ${{ secrets.GH_PAT_ACCOUNT_C }}
        run: |
          FIRST5="${{ steps.discovery.outputs.first5 }}"
          LAST5="${{ steps.discovery.outputs.last5 }}"

          # 用 Python 生成 JSON 并直接 curl 触发从节点
          python -c "
          import json, sys, subprocess, urllib.request, urllib.error

          first5_csv = sys.argv[1]
          last5_csv = sys.argv[2]
          pat_b = sys.argv[3]
          pat_c = sys.argv[4]

          first_items = [x.strip() for x in first5_csv.split(',') if x.strip()]
          last_items = [x.strip() for x in last5_csv.split(',') if x.strip()]

          # stocks 值必须是字符串（workflow_dispatch inputs 的要求）
          first_json_str = json.dumps(first_items)
          last_json_str = json.dumps(last_items)

          print('=== 前 5 支 -> 账户 B ===')
          print(first_json_str)
          print('=== 后 5 支 -> 账户 C ===')
          print(last_json_str)

          def trigger_workflow(pat, repo_url, payload):
              data = json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  repo_url,
                  data=data,
                  headers={
                      'Accept': 'application/vnd.github.v3+json',
                      'Authorization': f'token {pat}',
                      'Content-Type': 'application/json'
                  },
                  method='POST'
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status
              except urllib.error.HTTPError as e:
                  return e.code

          # 触发账户 B
          payload_b = {'inputs': {'stocks': first_json_str}, 'ref': 'master'}
          code_b = trigger_workflow(
              pat_b,
              'https://api.github.com/repos/zf6242206/AI-Native/actions/workflows/skills_runner.yml/dispatches',
              payload_b
          )
          print(f'--- 触发账户 B ---')
          if code_b in (201, 204):
              print('账户 B 触发成功')
          else:
              print(f'账户 B 触发失败，HTTP 状态码: {code_b}')

          # 触发账户 C
          payload_c = {'inputs': {'stocks': last_json_str}, 'ref': 'master'}
          code_c = trigger_workflow(
              pat_c,
              'https://api.github.com/repos/fz6242025/AI-Native/actions/workflows/skills_runner.yml/dispatches',
              payload_c
          )
          print(f'--- 触发账户 C ---')
          if code_c in (201, 204):
              print('账户 C 触发成功')
          else:
              print(f'账户 C 触发失败，HTTP 状态码: {code_c}')

          # 写入 GITHUB_OUTPUT
          with open(sys.argv[5], 'a') as f:
              f.write(f'http_code_b={code_b}\\n')
              f.write(f'http_code_c={code_c}\\n')
          " "$FIRST5" "$LAST5" "$GH_PAT_ACCOUNT_B" "$GH_PAT_ACCOUNT_C" "$GITHUB_OUTPUT"

      - name: 收集 B/C 账户评分结果
        env:
          GH_PAT_ACCOUNT_B: ${{ secrets.GH_PAT_ACCOUNT_B }}
          GH_PAT_ACCOUNT_C: ${{ secrets.GH_PAT_ACCOUNT_C }}
        run: |
          python scripts/collect_skill_scores.py \
            --repo-b "zf6242206/AI-Native" \
            --repo-c "fz6242025/AI-Native" \
            --pat-b "$GH_PAT_ACCOUNT_B" \
            --pat-c "$GH_PAT_ACCOUNT_C"

      - name: 提交评分历史
        # 本步骤失败不应阻塞后续的飞书通知（此前 exit 128 导致通知被整段跳过）
        continue-on-error: true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -d data/skill_history ] && [ -n "$(ls -A data/skill_history 2>/dev/null)" ]; then
            git add data/skill_history/
          else
            echo "data/skill_history 为空或不存在，跳过提交"
          fi
          if git diff --cached --quiet; then
            echo "无变更，无需提交"
            exit 0
          fi
          git commit -m "Skill history: $(date +%Y-%m-%d)"
          # 快照任务可能已推进远端，直接 push 会 non-fast-forward(exit 128)；
          # 先变基再推送，失败仅告警、不阻塞后续步骤
          GIT_EDITOR=true git pull --rebase --autostash origin master \
            || { echo "::warning::rebase 失败，跳过本次推送"; exit 0; }
          git push || echo "::warning::推送失败，跳过（不影响后续通知）"

      - name: 飞书通知主节点结果
        run: |
          STOCKS="${{ steps.discovery.outputs.stock_list }}"
          FIRST5="${{ steps.discovery.outputs.first5 }}"
          LAST5="${{ steps.discovery.outputs.last5 }}"
          CODE_B="${{ steps.trigger-slaves.outputs.http_code_b }}"
          CODE_C="${{ steps.trigger-slaves.outputs.http_code_c }}"

          python scripts/feishu_notifier.py \
            --mode main \
            --stocks "$STOCKS" \
            --first5 "$FIRST5" \
            --last5 "$LAST5" \
            --trigger-code-b "$CODE_B" \
            --trigger-code-c "$CODE_C"
