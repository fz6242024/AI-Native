name: AlphaSift Skills 深度评分

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      stocks:
        description: "股票代码 JSON 数组，例如 [\"600519\",\"000858\"]"
        required: true
        default: "[]"

jobs:
  skills-evaluation:
    name: Skills 深度评分
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      # LLM 配置：优先使用 LLM_BASE_URL + LLM_API_KEY
      # 如果没有，fallback 到 OPENAI_API_KEY
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # 飞书配置
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      FEISHU_WEBHOOK_MAIN: ${{ secrets.FEISHU_WEBHOOK_MAIN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行 Skills 深度评分
        id: evaluation
        env:
          STOCKS_INPUT: ${{ github.event.inputs.stocks }}
        run: |
          echo "=== 收到股票列表 ==="
          echo "$STOCKS_INPUT"

          echo "=== LLM 配置检查 ==="
          echo "LLM_BASE_URL: ${LLM_BASE_URL:+已配置(已隐藏)}"
          echo "LLM_API_KEY: ${LLM_API_KEY:+已配置(已隐藏)}"
          echo "OPENAI_API_KEY: ${OPENAI_API_KEY:+已配置(已隐藏)}"
          echo "FEISHU_WEBHOOK: ${FEISHU_WEBHOOK:+已配置(已隐藏)}"

          python scripts/run_skills_evaluation.py --stocks "$STOCKS_INPUT"

          echo "=== 评分完成 ==="
          echo "=== 结果文件内容 ==="
          cat analysis_result.json

      - name: 飞书推送评分结果
        run: |
          python scripts/feishu_notifier.py --result analysis_result.json

          echo "飞书通知完成"

      - name: 提交评分到仓库
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 只提交评分历史。analysis_result.json 在 .gitignore 里（运行时产物），
          # 把它一起列进 git add 会让整条命令以 exit 1 失败
          # （"The following paths are ignored by one of your .gitignore files"），
          # 连 data/skill_scores_history.json 也会被连带漏提交 ——
          # 这正是 C 账户评分历史一直 404 的原因。
          git add data/skill_scores_history.json
          git diff --cached --quiet || git commit -m "Skills scores: $(date +%Y-%m-%d)"
          git push
          echo "评分历史已提交到仓库"
