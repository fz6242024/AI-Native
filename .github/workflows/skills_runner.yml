name: AlphaSift Skills 深度评分

on:
  workflow_dispatch:
    inputs:
      stocks:
        description: "股票代码，逗号分隔"
        required: true
        default: ""

jobs:
  skills-evaluation:
    name: Skills 深度评分
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      FEISHU_WEBHOOK_MAIN: ${{ secrets.FEISHU_WEBHOOK_MAIN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行 Skills 深度评分
        id: evaluation
        run: |
          STOCKS="${{ github.event.inputs.stocks }}"
          echo "=== 收到股票列表 ==="
          echo "$STOCKS"

          STOCKS_JSON=$(echo "$STOCKS" | tr ',' '\n' | jq -R . | jq -s .)
          python scripts/run_skills_evaluation.py --stocks "$STOCKS_JSON"

          echo "=== 评分完成 ==="
          cat analysis_result.json

      - name: 飞书推送评分结果
        run: |
          python scripts/feishu_notifier.py --result analysis_result.json

          echo "飞书通知完成"
