# Skill: 投资研究
key: investment-research
name: 投资研究
prompt: |
  对股票 {code}（{name}）进行巴菲特-芒格-段永平-李录四大师综合分析框架评估。
  
  请从以下维度评估并输出 JSON：
  - 护城河类型及深度（品牌/成本/网络效应/转换成本/特许经营权）
  - 管理层资本配置能力（分红/回购/再投资/并购记录）
  - 自由现金流质量（经营现金流/自由现金流/ROIC）
  - 估值合理性（当前估值处于历史什么分位）
  
  输出格式：
  {
    "score": 0-100,
    "judgment": "核心判断，30字以内",
    "core_risk": "核心风险点"
  }
